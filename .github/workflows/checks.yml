name: Python checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m mypy arena
      - run: xvfb-run -a python -m pytest --cov=arena --cov-report=term-missing --cov-report=xml
      - run: python tools/count_lines.py
      - run: python tools/benchmark.py

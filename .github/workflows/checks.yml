name: Python checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.lock -e .
      - run: python -m mypy arena
      - run: python -m black --check arena tests tools
      - run: xvfb-run -a python -m pytest --cov=arena --cov-report=term-missing --cov-report=xml --cov-report=json:coverage.json
      - run: python tools/check_acceptance.py --coverage coverage.json
      - run: python tools/count_lines.py
      - run: python tools/benchmark.py
      - run: xvfb-run -a python tools/benchmark_gui.py --cycles 100
